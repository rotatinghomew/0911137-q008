<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>费用关联复核台</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><span>本地分析应用</span><h1>费用关联复核台</h1><p id="description"></p></header>
<main>
<form id="filters">
  <label>分析时点 <input name="cutoff" type="number" required></label>
  <label>业务范围 <select name="group"></select></label>
  <label>关联时窗 <input name="window" type="number" min="1" max="365" required></label>
  <label>批次容量 <input name="capacity" type="number" min="1" max="1000" required></label>
  <label><input name="exclude_public" type="checkbox"> 排除公共服务商</label>
  <button type="submit">更新分析</button>
</form>
<p id="status" role="status">正在读取资料</p>

<section aria-label="当前分析"><h2>当前资料摘要</h2><dl id="summary"></dl><ul id="notes"></ul><p id="digest"></p></section>

<section aria-label="关联线索"><h2>关联线索</h2><p class="hint">按固定权重整理待复核线索，不是违规结论，也不针对个人。点击一行查看支撑记录。</p><div id="leads" class="scroll"></div><div id="lead-detail" class="detail" hidden></div></section>

<section aria-label="复核反馈"><h2>复核反馈与下一批线索</h2><dl id="evaluation-summary"></dl><ul id="evaluation-notes"></ul><div id="evaluation-points" class="scroll"></div><div id="next-batch"></div></section>

<section aria-label="关系更正"><h2>关系更正与重算</h2><p class="hint">比较同一条关系的当前可见版本与上一条修订；旧线索的提出原因和支撑记录保留在保存的分析版本中。</p><div id="correction"></div></section>

<section aria-label="费用单金额列表"><h2>费用单金额列表</h2><p class="hint">原有的单笔金额视图，仅按金额排序；它不是违规结论。</p><div id="results" class="scroll"></div></section>

<section aria-label="保存的分析"><h2>分析版本</h2><form id="save"><label>版本名称 <input name="title" required maxlength="100" value="经营讨论"></label><button type="submit">保存当前分析</button></form><ul id="history"></ul></section>

<section aria-label="原始资料"><h2>资料查阅</h2><label>资料表 <select id="tables"></select></label><button id="source" type="button">查看资料</button><div id="raw" class="scroll"></div></section>
</main><script src="/app.js" defer></script>
</body></html>
